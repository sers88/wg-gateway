name: Update metacubexd

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update:
    name: Update metacubexd to latest
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Get current version
        id: current
        run: |
          VERSION=$(grep -oP 'METACUBEXD_VERSION=\Kv[0-9.]+' Dockerfile | head -1)
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not read METACUBEXD_VERSION from Dockerfile (got empty)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current: $VERSION"

      - name: Get latest version
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release view --repo MetaCubeX/metacubexd --json tagName -q '.tagName')
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Resolved latest version is empty or malformed (got '$TAG')"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Latest: $TAG"

      - name: Update Dockerfile
        if: steps.current.outputs.version != steps.latest.outputs.version
        run: |
          sed -i "s/^ARG METACUBEXD_VERSION=.*/ARG METACUBEXD_VERSION=${{ steps.latest.outputs.version }}/" Dockerfile

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Create Pull Request
        if: steps.current.outputs.version != steps.latest.outputs.version
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_TOKEN }}
          committer: "Evgeniy <22525066+sers88@users.noreply.github.com>"
          author: "Evgeniy <22525066+sers88@users.noreply.github.com>"
          commit-message: "chore(deps): update metacubexd to ${{ steps.latest.outputs.version }}"
          title: "chore(deps): update metacubexd to ${{ steps.latest.outputs.version }}"
          body: |
            Automated update of metacubexd from `${{ steps.current.outputs.version }}` to `${{ steps.latest.outputs.version }}`.

            metacubexd is a static UI bundle — no native dependencies or config changes.
            Low-risk update suitable for automatic merging.
          branch: auto-update/metacubexd-${{ steps.latest.outputs.version }}
          labels: dependencies
          delete-branch: true
