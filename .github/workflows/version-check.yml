name: Version Check

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check-versions:
    name: Check Component Versions
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v7

      - name: Get current versions from Dockerfile
        id: current
        run: |
          WG_EASY_V=$(grep -oP 'wg-easy:\K[0-9.]+' Dockerfile | head -1)
          MIHOMO_V=$(grep -oP 'MIHOMO_VERSION=v\K[0-9.]+' Dockerfile | head -1)
          echo "wg_easy=$WG_EASY_V" >> "$GITHUB_OUTPUT"
          echo "mihomo=$MIHOMO_V" >> "$GITHUB_OUTPUT"

      - name: Check wg-easy latest
        id: wg-easy
        run: |
          LATEST=$(curl -sf "https://api.github.com/repos/wg-easy/wg-easy/releases/latest" | jq -r '.tag_name' | sed 's/^v//')
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=${{ steps.current.outputs.wg_easy }}" >> "$GITHUB_OUTPUT"

      - name: Check Mihomo latest
        id: mihomo
        run: |
          LATEST=$(curl -sf "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" | jq -r '.tag_name' | sed 's/^v//')
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=${{ steps.current.outputs.mihomo }}" >> "$GITHUB_OUTPUT"

      - name: Create or update issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=""
          TITLE="[version-check] Component updates available"

          # wg-easy
          if [ "${{ steps.wg-easy.outputs.latest }}" != "${{ steps.wg-easy.outputs.current }}" ]; then
            BODY+="- **wg-easy**: \`${{ steps.wg-easy.outputs.current }}\` → \`${{ steps.wg-easy.outputs.latest }}\`  "$'\n'
          fi

          # Mihomo
          if [ "${{ steps.mihomo.outputs.latest }}" != "${{ steps.mihomo.outputs.current }}" ]; then
            BODY+="- **Mihomo**: \`${{ steps.mihomo.outputs.current }}\` → \`${{ steps.mihomo.outputs.latest }}\`  "$'\n'
          fi

          # Find existing open issues by exact title (label lookup is unreliable:
          # the label may not exist in the repo, so issues were created without it)
          EXISTING=$(gh issue list --search "in:title \"$TITLE\"" --state open --json number -q '.[].number' 2>/dev/null || true)

          if [ -z "$BODY" ]; then
            echo "All components are up to date."
            # Close ALL existing issues if any
            for ISSUE in $EXISTING; do
              gh issue close "$ISSUE" --reason "completed" --comment "All components are now up to date." || true
            done
            exit 0
          fi

          BODY+="  "$'\n'"Update the versions in \`Dockerfile\` and update the \`MIHOMO_SHA256_*\` values if Mihomo changed."

          FIRST=$(echo "$EXISTING" | head -n1)
          if [ -n "$FIRST" ]; then
            gh issue edit "$FIRST" --body "$BODY"
            echo "Updated existing issue #$FIRST"
            # Close any leftover duplicates, keep only $FIRST
            for ISSUE in $EXISTING; do
              if [ "$ISSUE" != "$FIRST" ]; then
                gh issue close "$ISSUE" --reason "not planned" --comment "Duplicate of #$FIRST." || true
              fi
            done
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "version-check" || \
              gh issue create --title "$TITLE" --body "$BODY"
            echo "Created new issue"
          fi
