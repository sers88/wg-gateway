name: CI

on:
  push:
    branches: [main, feature/arm64-support]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

  smoke-test:
    name: Smoke Test (${{ matrix.platform }})
    needs: shellcheck
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: wg-gateway:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image contents
        run: |
          echo "=== Check binaries ==="
          docker run --rm --entrypoint "" wg-gateway:test which mihomo
          docker run --rm --entrypoint "" wg-gateway:test which wg
          docker run --rm --entrypoint "" wg-gateway:test which node
          docker run --rm --entrypoint "" wg-gateway:test which dumb-init

          echo "=== Check Mihomo binary is executable ==="
          docker run --rm --entrypoint "" wg-gateway:test /usr/local/bin/mihomo -v

          echo "=== Check metacubexd UI assets ==="
          docker run --rm --entrypoint "" wg-gateway:test ls /opt/metacubexd/index.html

          echo "=== Check default config ==="
          docker run --rm --entrypoint "" wg-gateway:test cat /defaults/mihomo/config.yaml | head -5

          echo "=== Check scripts ==="
          docker run --rm --entrypoint "" wg-gateway:test ls -la /scripts/

          echo "=== Check supervisord config ==="
          docker run --rm --entrypoint "" wg-gateway:test cat /etc/supervisor/conf.d/wg-gateway.conf | head -5

      - name: Start container
        run: |
          docker run -d \
            --name wg-gateway-test \
            --network host \
            --cap-add NET_ADMIN \
            --cap-add SYS_MODULE \
            --device /dev/net/tun:/dev/net/tun \
            -e WG_HOST=127.0.0.1 \
            -e WG_EASY_INIT_PASSWORD=test-password \
            wg-gateway:test

      - name: Wait for wg-easy
        run: |
          echo "Waiting for wg-easy to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:51821 > /dev/null 2>&1; then
              echo "wg-easy is up after $((i * 2))s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: wg-easy did not start"
              docker logs wg-gateway-test 2>&1 | tail -40
              exit 1
            fi
            sleep 2
          done

      - name: Check wg-easy response
        run: |
          RESPONSE=$(curl -sf http://localhost:51821 | head -c 300)
          echo "wg-easy response: $RESPONSE"
          echo "$RESPONSE" | grep -q "html" || {
            echo "ERROR: wg-easy did not return HTML"
            exit 1
          }

      - name: Show container logs
        if: always()
        run: docker logs wg-gateway-test 2>&1 | tail -50

      - name: Cleanup
        if: always()
        run: docker rm -f wg-gateway-test 2>/dev/null || true

  build-and-push:
    name: Build and Push
    needs: [shellcheck, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            docker.io/ksantd/wg-gateway
            ghcr.io/sers88/wg-gateway
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value={{date 'YY.MM.DD.HH.mm'}},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=snapshot,enable=${{ github.ref == 'refs/heads/feature/arm64-support' }}
            type=raw,value=snapshot-{{sha}},enable=${{ github.ref == 'refs/heads/feature/arm64-support' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
